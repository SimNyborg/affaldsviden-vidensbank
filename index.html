<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vidensbank · designforslag</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Roboto:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#0A602D}a:hover{color:#06401E}
button:focus:not(:focus-visible){outline:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #0A602D;outline-offset:2px}
.vb-hero{position:relative;isolation:isolate;background-color:#5E7A86;background-image:url(img/4def46095b79ff3fe83626bdb46ecce2.jpg);background-size:cover;background-position:center}
.vb-hero::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(20,30,40,.38) 0%,rgba(20,30,40,.22) 45%,rgba(20,30,40,.08) 70%,rgba(20,30,40,.25) 100%)}
.vb-hero-video{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none}
@media (max-width:799px){.vb-hero::before{background:linear-gradient(180deg,rgba(20,30,40,.5) 0%,rgba(20,30,40,.35) 60%,rgba(20,30,40,.3) 100%)}}
@media (prefers-reduced-motion:reduce){.vb-hero-video{display:none}}
.vb-hero a.vb-lnk,.vb-hero button.vb-lnk{color:#A8DC6E}
.vb-pil{animation:vb-vip 2.4s ease-in-out infinite}
@keyframes vb-vip{0%,60%,100%{transform:translateY(0)}75%{transform:translateY(5px)}90%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.vb-pil{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="vb-skabelon">
<div style="background: #FFFFFF; color: #24312A; font-family: 'Roboto', Arial, sans-serif; font-size: 16px; line-height: 1.5; min-height: 1400px;">

  <header style="background: #FFFFFF; border-bottom: 1px solid #DAE0E0;">
    <div style="max-width: 1320px; margin: 0 auto; padding: 12px max(16px, 3vw); display: flex; align-items: center; gap: 28px;">
      <a href="#" aria-label="Affaldsviden" style="display: block; line-height: 0;"><img src="img/113a04a9753750471211ed7ca8080ecc.png" alt="Affaldsviden" style="{{ logoStyle }}"></a>
      <template data-if="{{ wide }}">
        <nav aria-label="Hovedmenu" style="margin-left: auto; display: flex; flex-wrap: wrap; gap: 22px; font-size: 15px;">
          <a href="#" style="color: #24312A; text-decoration: none;">Om</a>
          <a href="#" style="color: #24312A; text-decoration: none;">Netværk</a>
          <a href="#" style="color: #24312A; text-decoration: none;">Nyheder</a>
          <a href="#" style="color: #24312A; text-decoration: none;">Affaldsfeed</a>
          <a href="#" style="color: #24312A; text-decoration: none;">For alle</a>
          <a href="#" style="color: #24312A; text-decoration: none;">Min kommune</a>
        </nav>
      </template>
      <template data-if="{{ narrow }}">
        <button type="button" aria-expanded="{{ menuOpenStr }}" onClick="{{ toggleMenu }}" style="margin-left: auto; min-width: 44px; min-height: 44px; padding: 0 12px; border: 1px solid #DAE0E0; border-radius: 10px; background: #FFFFFF; color: #24312A; font: 500 14px 'Roboto', Arial, sans-serif; cursor: pointer;">{{ menuLabel }}</button>
      </template>
    </div>
    <template data-if="{{ mobileMenu }}">
      <nav aria-label="Hovedmenu" style="display: flex; flex-direction: column; padding: 0 max(16px, 3vw) 12px; font-size: 16px;">
        <a href="#" style="display: flex; align-items: center; min-height: 44px; color: #24312A; text-decoration: none; border-top: 1px solid #DAE0E0;">Om</a>
        <a href="#" style="display: flex; align-items: center; min-height: 44px; color: #24312A; text-decoration: none; border-top: 1px solid #DAE0E0;">Netværk</a>
        <a href="#" style="display: flex; align-items: center; min-height: 44px; color: #24312A; text-decoration: none; border-top: 1px solid #DAE0E0;">Nyheder</a>
        <a href="#" style="display: flex; align-items: center; min-height: 44px; color: #24312A; text-decoration: none; border-top: 1px solid #DAE0E0;">Affaldsfeed</a>
        <a href="#" style="display: flex; align-items: center; min-height: 44px; color: #24312A; text-decoration: none; border-top: 1px solid #DAE0E0;">For alle</a>
        <a href="#" style="display: flex; align-items: center; min-height: 44px; color: #24312A; text-decoration: none; border-top: 1px solid #DAE0E0;">Min kommune</a>
      </nav>
    </template>
  </header>

  <!-- Toppen med video og søgefelt vises kun på hovedsiden. Søgningen filtrerer dokumenterne lige nedenfor.
       Dokumentsiden og indsend-siden starter direkte med brødkrummen. -->
  <template data-if="{{ heroFull }}">
  <section class="vb-hero" style="color: #FFFFFF;">
    <!-- Baggrundsvideo: 15 sekunder, lydløs og i loop. Stillbilledet bagved vises, til videoen er klar, og ved reduceret bevægelse. -->
    <video class="vb-hero-video" data-keep="hero-video" src="img/4263c85a98220fcc1ecfb5f14a98ab4a.mp4" poster="img/4def46095b79ff3fe83626bdb46ecce2.jpg" autoplay muted loop playsinline preload="auto" aria-hidden="true" tabindex="-1"></video>
    <div style="{{ heroInnerStyle }}">
      <div style="{{ heroMainStyle }}">
      <h1 style="{{ heroH1Style }}"><a href="#" onClick="{{ goHome }}" style="color: #FFFFFF; text-decoration: none;">VIDENSBANK</a></h1>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; width: 100%; max-width: 620px;">
        <label for="q" style="position: absolute; left: -9999px;">{{ qLabel }}</label>
        <input id="q" type="search" enterkeyhint="search" value="{{ q }}" onInput="{{ setQ }}" onKeyDown="{{ qKey }}" placeholder="{{ qPlaceholder }}" style="flex: 1 1 200px; min-width: 0; font: inherit; font-size: 17px; padding: 14px 16px; border: 0; border-radius: 10px; background: #FFFFFF; color: #24312A; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);">
        <button type="button" onClick="{{ toResults }}" style="min-height: 52px; padding: 0 22px; border: 0; border-radius: 10px; background: #0A602D; color: #FFFFFF; font: 500 16px 'Roboto', Arial, sans-serif; cursor: pointer; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);">Søg</button>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;">
        <button type="button" aria-expanded="{{ aiOpenStr }}" onClick="{{ toggleAi }}" style="min-height: 40px; padding: 0 14px; border: 1px solid #FFFFFF; border-radius: 999px; background: rgba(10, 40, 25, 0.55); color: #FFFFFF; font: 500 15px 'Roboto', Arial, sans-serif; cursor: pointer;">{{ aiToggleLabel }}</button>
      </div>
      <template data-if="{{ heroAi }}">
        <div style="box-sizing: border-box; width: 100%; max-width: 620px; display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 15px; background: #FFFFFF; color: #24312A; text-align: left; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);">
          <label for="aiq" style="font-weight: 700;">Stil et spørgsmål, eller beskriv, hvad du leder efter</label>
          <textarea id="aiq" rows="2" value="{{ aiQ }}" onInput="{{ setAiQ }}" placeholder="Fx: Hvad koster det at indsamle batterier?" style="font: inherit; padding: 10px 12px; border: 1px solid #A9B5B0; border-radius: 10px; resize: vertical; color: #24312A;"></textarea>
          <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
            <button type="button" onClick="{{ askNow }}" style="min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #0A602D; color: #FFFFFF; font: 500 15px 'Roboto', Arial, sans-serif; cursor: pointer;">Spørg</button>
            <span style="font-size: 13px; color: #50656E;">Svarer ud fra vidensbankens dokumenter og viser de dokumenter, der passer til spørgsmålet.</span>
          </div>
          <template data-if="{{ aiAsked }}">
            <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid #DAE0E0;">
              <p style="margin: 0;">{{ aiAnswer }}</p>
              <template data-if="{{ aiHasSources }}">
                <div style="display: flex; flex-direction: column; gap: 2px; font-size: 14px;">
                  <span style="color: #50656E;">Kilder</span>
                  <template data-for="{{ aiSources }}" data-as="s">
                    <button type="button" onClick="{{ s.open }}" style="align-self: flex-start; min-height: 32px; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; font: inherit; color: #0A602D; text-decoration: underline;">{{ s.label }}</button>
                  </template>
                </div>
              </template>
              <template data-if="{{ aiHasDocs }}">
                <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 4px;">
                  <span style="font-size: 14px; color: #50656E;">{{ aiDocsLabel }}</span>
                  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: 8px;">
                    <template data-for="{{ aiDocs }}" data-as="d">
                      <button type="button" onClick="{{ d.open }}" style="display: flex; gap: 10px; align-items: center; padding: 8px; border: 1px solid #DAE0E0; border-radius: 10px; background: #FFFFFF; text-align: left; cursor: pointer; font: inherit; color: inherit; min-width: 0;">
                        <span style="flex: 0 0 38px; width: 38px; aspect-ratio: 210 / 297; overflow: hidden; border: 1px solid #DAE0E0; border-radius: 4px; background: {{ d.coverBg }};"><template data-if="{{ d.img }}"><img src="{{ d.img }}" alt="" style="width: 100%; height: 100%; object-fit: contain; display: block;"></template></span>
                        <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
                          <span style="font-weight: 700; font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{ d.title }}</span>
                          <span style="font-size: 13px; color: #50656E;">{{ d.meta }}</span>
                        </span>
                      </button>
                    </template>
                  </div>
                </div>
              </template>
              <span style="font-size: 12px; color: #50656E;">Svaret er lavet med AI ud fra vidensbankens dokumenter. I prototypen er det et eksempel.</span>
            </div>
          </template>
        </div>
      </template>
      </div>
      <template data-if="{{ heroArrow }}">
        <button type="button" aria-label="Rul ned til indholdet" onClick="{{ scrollDown }}" style="position: absolute; right: max(16px, 3vw); bottom: 28px; width: 56px; height: 56px; padding: 0; display: flex; align-items: center; justify-content: center; border: 1.5px solid #FFFFFF; border-radius: 50%; background: rgba(0, 0, 0, 0.18); color: #FFFFFF; cursor: pointer;">
          <svg class="vb-pil" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16"></path><path d="M5 13l7 7 7-7"></path></svg>
        </button>
      </template>
    </div>
  </section>
  </template>

  <main id="vb-indhold" style="max-width: 1320px; margin: 0 auto; padding: 24px max(16px, 3vw) 56px; display: flex; flex-direction: column; gap: 24px; scroll-margin-top: 0;">

    <template data-if="{{ hasCrumb }}">
      <nav aria-label="Brødkrumme" style="display: flex; flex-wrap: wrap; gap: 6px; font-size: 15px; color: #50656E; margin-bottom: -16px;">
        <a href="#" onClick="{{ crumbRoot }}">Vidensbank</a>
        <span aria-hidden="true">›</span>
        <template data-if="{{ hasCrumbMid }}"><a href="#" onClick="{{ crumbMid.go }}">{{ crumbMid.label }}</a><span aria-hidden="true">›</span></template>
        <span>{{ crumbHere }}</span>
      </nav>
    </template>

    <!-- HOVEDSIDE: om vidensbanken øverst, filtre i venstre side og dokumenterne til højre. Alle dokumenter ligger her, uden en ekstra side.
         Faste dokumenter vælges også i venstre side og vises i samme kolonne. På mobil står valgene i en vandret række og filtrene bag en knap. -->
    <template data-if="{{ isHome }}">
      <section aria-labelledby="vb-om" style="{{ omStyle }}">
        <div style="flex: 3 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
          <h2 id="vb-om" style="margin: 0; font-size: 18px; font-weight: 700; color: #0A602D;">Om vidensbanken</h2>
          <p style="margin: 0; max-width: 75ch;">Formålet med Vidensbanken er at dele viden med hinanden på affaldsområdet. Vidensbanken indeholder en række dokumenter fra de kommuner og affaldsselskaber, som deltager i Affaldsviden.dk. Vidensbanken indeholder interne notater, undersøgelser, konsulentrapporter, kommunikationsmateriale og andre dokumenter, som I kan lade jer inspirere af.</p>
        </div>
        <div style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 8px; align-items: flex-start;">
          <span style="font-weight: 700;">Har I dokumenter, som andre kan bruge?</span>
          <button type="button" onClick="{{ goIndsend }}" style="min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #0A602D; color: #FFFFFF; font: 500 15px 'Roboto', Arial, sans-serif; cursor: pointer;">Indsend dokumenter</button>
          <span style="font-size: 14px; color: #50656E;">Eller send dem til <b style="color: #24312A; user-select: all;">jhn@jhn.dk</b>.</span>
        </div>
      </section>

      <div style="{{ layoutStyle }}">
        <template data-if="{{ wide }}">
          <aside aria-label="Vælg dokumenter og filtre" style="{{ asideStyle }}">
            <nav aria-label="Dokumenter" style="display: flex; flex-direction: column; gap: 2px; padding-bottom: 12px; border-bottom: 1px solid #DAE0E0;">
              <button type="button" data-key="valg:viden" aria-pressed="{{ vidColl.on }}" onClick="{{ vidColl.go }}" style="{{ vidColl.style }}"><span style="flex: 1; text-align: left;">Vidensdokumenter</span><span style="{{ vidColl.countStyle }}">{{ vidColl.count }}</span></button>
              <span style="{{ sideSubStyle }}">Faste dokumenter</span>
              <template data-for="{{ collSerier }}" data-as="c">
                <button type="button" data-key="{{ c.key }}" aria-pressed="{{ c.on }}" title="{{ c.desc }}" onClick="{{ c.go }}" style="{{ c.style }}"><span style="flex: 1; text-align: left;">{{ c.name }}</span><span style="{{ c.tagStyle }}">{{ c.tag }}</span></button>
              </template>
            </nav>
            <template data-if="{{ inViden }}">
              <div style="display: flex; flex-direction: column;">
                <template data-for="{{ filterGroups }}" data-as="g">
                  <div style="{{ g.boxStyle }}">
                    <button type="button" data-key="{{ g.headKey }}" aria-expanded="{{ g.openStr }}" onClick="{{ g.toggle }}" style="{{ g.headStyle }}"><span style="flex: 1; min-width: 0; text-align: left;">{{ g.label }}</span><span style="{{ g.badgeStyle }}">{{ g.badge }}</span><span aria-hidden="true" style="{{ g.chevStyle }}">{{ g.chev }}</span></button>
                    <template data-if="{{ g.open }}">
                      <div style="display: flex; flex-direction: column; padding: 0 0 10px;">
                        <template data-if="{{ g.hasFind }}">
                          <input id="{{ g.findId }}" type="search" aria-label="{{ g.findLabel }}" value="{{ g.find }}" onInput="{{ g.setFind }}" placeholder="{{ g.findLabel }}" style="{{ g.findStyle }}">
                        </template>
                        <template data-for="{{ g.items }}" data-as="o">
                          <button type="button" data-key="{{ o.key }}" role="checkbox" aria-checked="{{ o.checkedStr }}" title="{{ o.title }}" onClick="{{ o.toggle }}" style="{{ o.style }}"><span aria-hidden="true" style="{{ o.boxStyle }}">{{ o.mark }}</span><span style="flex: 1; min-width: 0; text-align: left;">{{ o.label }}</span><span style="{{ o.countStyle }}">{{ o.count }}</span></button>
                        </template>
                        <template data-if="{{ g.hasMore }}">
                          <button type="button" data-key="{{ g.moreKey }}" onClick="{{ g.toggleMore }}" style="{{ g.moreStyle }}">{{ g.moreLabel }}</button>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </aside>
        </template>

        <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px;">
          <template data-if="{{ narrow }}">
            <div data-scroll="valg" style="{{ chipRowStyle }}">
              <div role="group" aria-label="Vælg dokumenter" style="display: flex; gap: 8px; width: max-content;">
                <template data-for="{{ collChips }}" data-as="c">
                  <button type="button" data-key="{{ c.key }}" aria-pressed="{{ c.on }}" onClick="{{ c.go }}" style="{{ c.style }}">{{ c.name }}</button>
                </template>
              </div>
            </div>
          </template>

          <template data-if="{{ inViden }}">
            <div id="vb-liste" style="display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end; justify-content: space-between; scroll-margin-top: 12px;">
              <div style="display: flex; flex-direction: column;">
                <h2 style="margin: 0; font-size: clamp(22px, 2.6vw, 28px); font-weight: 700; color: #0A602D;">Vidensdokumenter</h2>
                <span style="font-size: 15px; color: #50656E;">{{ listCount }}</span>
              </div>
              <div style="display: flex; gap: 8px; align-items: center;">
                <template data-if="{{ narrow }}">
                  <button type="button" data-key="filtre" aria-expanded="{{ filtersOpenStr }}" onClick="{{ toggleFilters }}" style="{{ filterBtnStyle }}">{{ filterToggleLabel }}</button>
                </template>
                <label for="fsort" style="font-size: 14px; color: #50656E;">Sortér</label>
                <select id="fsort" value="{{ sortValue }}" onChange="{{ setFSort }}" style="{{ sortSelStyle }}">
                  <template data-for="{{ sortOptions }}" data-as="o"><option value="{{ o.value }}">{{ o.label }}</option></template>
                </select>
              </div>
            </div>
            <template data-if="{{ showPanel }}">
              <div style="{{ panelStyle }}">
                <template data-for="{{ filterGroups }}" data-as="g">
                  <div style="{{ g.boxStyle }}">
                    <button type="button" data-key="{{ g.headKey }}" aria-expanded="{{ g.openStr }}" onClick="{{ g.toggle }}" style="{{ g.headStyle }}"><span style="flex: 1; min-width: 0; text-align: left;">{{ g.label }}</span><span style="{{ g.badgeStyle }}">{{ g.badge }}</span><span aria-hidden="true" style="{{ g.chevStyle }}">{{ g.chev }}</span></button>
                    <template data-if="{{ g.open }}">
                      <div style="display: flex; flex-direction: column; padding: 0 0 10px;">
                        <template data-if="{{ g.hasFind }}">
                          <input id="{{ g.findId }}" type="search" aria-label="{{ g.findLabel }}" value="{{ g.find }}" onInput="{{ g.setFind }}" placeholder="{{ g.findLabel }}" style="{{ g.findStyle }}">
                        </template>
                        <template data-for="{{ g.items }}" data-as="o">
                          <button type="button" data-key="{{ o.key }}" role="checkbox" aria-checked="{{ o.checkedStr }}" title="{{ o.title }}" onClick="{{ o.toggle }}" style="{{ o.style }}"><span aria-hidden="true" style="{{ o.boxStyle }}">{{ o.mark }}</span><span style="flex: 1; min-width: 0; text-align: left;">{{ o.label }}</span><span style="{{ o.countStyle }}">{{ o.count }}</span></button>
                        </template>
                        <template data-if="{{ g.hasMore }}">
                          <button type="button" data-key="{{ g.moreKey }}" onClick="{{ g.toggleMore }}" style="{{ g.moreStyle }}">{{ g.moreLabel }}</button>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
                <button type="button" onClick="{{ showResults }}" style="{{ panelDoneStyle }}">{{ panelDoneLabel }}</button>
              </div>
            </template>
            <template data-if="{{ hasChips }}">
              <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center;">
                <template data-for="{{ activeChips }}" data-as="c">
                  <button type="button" aria-label="{{ c.aria }}" onClick="{{ c.remove }}" style="{{ activeChipStyle }}"><span>{{ c.label }}</span><span aria-hidden="true" style="font-size: 17px; line-height: 1;">×</span></button>
                </template>
                <button type="button" onClick="{{ clearFilters }}" style="{{ linkBtnStyle }}">Ryd alle</button>
              </div>
            </template>
            <template data-if="{{ hasSearchInfo }}">
              <p style="margin: -4px 0 0; font-size: 14px; color: #50656E; max-width: 75ch;">{{ searchInfo }}</p>
            </template>
            <template data-if="{{ hasPartial }}">
              <p style="margin: 0; padding: 10px 14px; border-radius: 10px; background: #F4F6F2; font-size: 14px; color: #24312A;">{{ partialText }}</p>
            </template>
            <template data-if="{{ hasQuick }}">
              <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 15px; background: #F4F6F2;">
                <template data-for="{{ quickUnits }}" data-as="u">
                  <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center;">
                    <span style="font-size: 15px; font-weight: 700; margin-right: 4px;">{{ u.name }}</span>
                    <template data-for="{{ u.docs }}" data-as="d"><button type="button" onClick="{{ d.open }}" style="{{ quickChipStyle }}">{{ d.label }}</button></template>
                  </div>
                </template>
                <template data-if="{{ hasQuickLinks }}">
                  <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center;">
                    <span style="font-size: 15px; color: #50656E;">{{ quickLinksLabel }}</span>
                    <template data-for="{{ quickLinks }}" data-as="l"><button type="button" onClick="{{ l.go }}" style="{{ temaPillStyle }}">{{ l.name }}</button></template>
                  </div>
                </template>
              </div>
            </template>
            <div style="{{ listGridStyle }}">
              <template data-for="{{ listDocs }}" data-as="d">
                <button type="button" onClick="{{ d.open }}" style="{{ d.cardStyle }}">
                  <span style="{{ d.coverStyle }}">
                    <template data-if="{{ d.img }}"><img src="{{ d.img }}" alt="" style="width: 100%; height: 100%; object-fit: contain; object-position: center; display: block;"></template>
                    <template data-if="{{ d.noImg }}">
                      <span style="{{ d.fakeCoverStyle }}">
                        <span style="font-size: 12px; font-weight: 500; color: #0A602D;">{{ d.org }}</span>
                        <span style="{{ d.fakeTitleStyle }}">{{ d.coverTitle }}</span>
                        <span style="font-size: 13px; color: #3D5246;">{{ d.coverYear }}</span>
                      </span>
                    </template>
                  </span>
                  <span style="{{ d.textStyle }}">
                    <span style="font-weight: 700; font-size: 15px; line-height: 1.3; min-height: 2.6em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{ d.title }}</span>
                    <span style="{{ d.resStyle }}">{{ d.res }}</span>
                    <span style="margin-top: auto; font-size: 13px; color: #50656E;">{{ d.meta }}</span>
                  </span>
                </button>
              </template>
            </div>
            <template data-if="{{ hasMoreDocs }}">
              <button type="button" data-key="flere" onClick="{{ showMoreDocs }}" style="align-self: center; min-height: 44px; padding: 0 24px; border: 0; border-radius: 10px; background: #0A602D; color: #FFFFFF; font: 500 15px 'Roboto', Arial, sans-serif; cursor: pointer;">{{ moreDocsLabel }}</button>
            </template>
            <template data-if="{{ listEmpty }}"><p style="margin: 0; padding: 18px 20px; border-radius: 15px; background: #F4F6F2; color: #50656E; max-width: 720px;">{{ emptyText }}</p></template>
          </template>

          <template data-if="{{ inSerie }}">
            <section id="vb-liste" style="display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 12px;">
              <h2 style="margin: 0; font-size: clamp(22px, 2.6vw, 28px); font-weight: 700; color: #0A602D;">{{ serieHeading }}</h2>
              <template data-if="{{ serie.ready }}">
                <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
                  <template data-if="{{ serie.hasVariant }}">
                    <div style="display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: #F4F6F2;" role="group" aria-label="Variant">
                      <button type="button" data-key="variant:H" aria-pressed="{{ hOn }}" onClick="{{ setH }}" style="{{ hStyle }}">Husholdning</button>
                      <button type="button" data-key="variant:E" aria-pressed="{{ eOn }}" onClick="{{ setE }}" style="{{ eStyle }}">Erhverv</button>
                    </div>
                  </template>
                </div>
                <p style="margin: 0; font-size: 14px; color: #50656E;">{{ serieHint }}</p>
                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(270px, 100%), 1fr)); gap: 12px;">
                  <template data-for="{{ rows }}" data-as="r">
                    <div style="{{ r.cardStyle }}">
                      <b style="font-size: 16px;">{{ r.unit }}</b>
                      <span style="display: flex; flex-wrap: wrap; gap: 6px;">
                        <template data-for="{{ r.chips }}" data-as="c">
                          <button type="button" title="{{ c.title }}" onClick="{{ c.open }}" style="{{ c.style }}">{{ c.label }}</button>
                        </template>
                      </span>
                    </div>
                  </template>
                </div>
                <template data-if="{{ noUnitHit }}">
                  <p style="margin: 0; padding: 18px 20px; border-radius: 15px; background: #F4F6F2; color: #50656E; max-width: 720px;">{{ noUnitText }}</p>
                </template>
                <template data-if="{{ hasEmpty }}">
                  <p style="margin: 0; font-size: 14px; color: #50656E;"><b style="color: #24312A;">Endnu uden dokumenter:</b> {{ emptyUnits }}</p>
                </template>
                <template data-if="{{ hasMoreUnits }}">
                  <button type="button" onClick="{{ showAllUnits }}" style="align-self: center; min-height: 44px; padding: 0 22px; border: 0; border-radius: 10px; background: #0A602D; color: #FFFFFF; font: 500 15px 'Roboto', Arial, sans-serif; cursor: pointer;">{{ moreUnitsLabel }}</button>
                </template>
              </template>
              <template data-if="{{ serie.proposal }}">
                <p style="margin: 0; padding: 18px 20px; border-radius: 15px; background: #F4F6F2; max-width: 720px;">Forslag til en ny fast dokumenttype. Den bygges op som gebyrbladene med ét kort pr. {{ serie.unitWord }} og udgaverne vist med den nyeste først, når dokumenterne er samlet ind.</p>
              </template>
            </section>
          </template>
        </div>
      </div>
    </template>

    <!-- INDSEND DOKUMENTER -->
    <template data-if="{{ isIndsend }}">
      <section style="display: flex; flex-direction: column; gap: 14px; max-width: 820px;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <h2 style="margin: 0; font-size: clamp(26px, 3.5vw, 34px); font-weight: 700; color: #0A602D;">Indsend dokumenter</h2>
          <p style="margin: 0; color: #50656E;">Del interne notater, undersøgelser, konsulentrapporter, kommunikationsmateriale og andre dokumenter med de kommuner og affaldsselskaber, der deltager i Affaldsviden.dk. Du kan også sende dem til <b style="color: #24312A; user-select: all;">jhn@jhn.dk</b>.</p>
        </div>
        <template data-if="{{ upNotSent }}">
          <div style="display: flex; flex-direction: column; gap: 12px; padding: 18px; border: 1px solid #DAE0E0; border-radius: 15px; background: #FFFFFF;">
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <span style="font-weight: 700;">Dokumenter</span>
              <label for="upfiles" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; min-height: 56px; padding: 10px 16px; border: 2px dashed #9CC9AA; border-radius: 12px; background: #F4F6F2; cursor: pointer;">
                <span style="display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 8px; background: #0A602D; color: #FFFFFF; font-weight: 500;">Vælg filer</span>
                <span style="font-size: 14px; color: #50656E;">PDF, Word, Excel eller PowerPoint. Du kan vælge flere på én gang.</span>
                <input id="upfiles" type="file" multiple onChange="{{ setUpFiles }}" style="position: absolute; left: -9999px;">
              </label>
              <template data-if="{{ upHasFiles }}">
                <span style="font-size: 14px; color: #24312A;">Valgt: {{ upFileNames }}</span>
              </template>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px 16px; align-items: end;">
              <label style="display: flex; flex-direction: column; gap: 4px; font-weight: 700;"><span>Kommune eller affaldsselskab</span>
                <input id="uporg" type="text" value="{{ upOrg }}" onInput="{{ setUpOrg }}" style="font: 400 16px 'Roboto', Arial, sans-serif; padding: 9px 12px; border: 1px solid #A9B5B0; border-radius: 10px; color: #24312A; min-width: 0;">
              </label>
              <label style="display: flex; flex-direction: column; gap: 4px; font-weight: 700;"><span>Dit navn</span>
                <input id="upname" type="text" value="{{ upName }}" onInput="{{ setUpName }}" style="font: 400 16px 'Roboto', Arial, sans-serif; padding: 9px 12px; border: 1px solid #A9B5B0; border-radius: 10px; color: #24312A; min-width: 0;">
              </label>
              <label style="display: flex; flex-direction: column; gap: 4px; font-weight: 700;"><span>Din e-mail</span>
                <input id="upmail" type="email" value="{{ upMail }}" onInput="{{ setUpMail }}" style="font: 400 16px 'Roboto', Arial, sans-serif; padding: 9px 12px; border: 1px solid #A9B5B0; border-radius: 10px; color: #24312A; min-width: 0;">
              </label>
            </div>
            <template data-if="{{ upHasError }}">
              <p role="alert" style="margin: 0; padding: 8px 12px; border-radius: 10px; background: #FFF4E0; color: #5C3A00;">{{ upError }}</p>
            </template>
            <div style="display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between;">
              <label style="flex: 1 1 320px; min-width: 0; display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: 15px;">
                <input id="upshare" type="checkbox" required aria-required="true" onChange="{{ setUpShare }}" style="width: 20px; height: 20px; margin: 1px 0 0; accent-color: #0A602D; flex: none;">
                <span>Jeg bekræfter, at dokumenterne må deles med de kommuner og affaldsselskaber, der deltager i Affaldsviden.dk.</span>
              </label>
              <button type="button" onClick="{{ sendUp }}" aria-disabled="{{ upNotReady }}" style="{{ upBtnStyle }}">Indsend</button>
            </div>
          </div>
        </template>
        <template data-if="{{ upSent }}">
          <div style="display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: 15px; background: #E6F4EA;">
            <h3 style="margin: 0; font-size: 20px; color: #0A602D;">Tak for dit bidrag</h3>
            <p style="margin: 0;">{{ upThanks }}</p>
            <span style="font-size: 13px; color: #50656E;">I prototypen bliver intet sendt.</span>
            <button type="button" onClick="{{ goHome }}" style="align-self: flex-start; min-height: 44px; padding: 0 20px; border: 1px solid #0A602D; border-radius: 10px; background: #FFFFFF; color: #0A602D; font: 500 15px 'Roboto', Arial, sans-serif; cursor: pointer;">Tilbage til vidensbanken</button>
          </div>
        </template>
      </section>
    </template>

    <!-- DOKUMENTSIDE -->
    <template data-if="{{ isDoc }}">
      <article style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start;">
        <span style="{{ doc.coverStyle }}">
          <template data-if="{{ doc.img }}"><img src="{{ doc.img }}" alt="" style="width: 100%; height: 100%; object-fit: contain; object-position: center; display: block;"></template>
          <template data-if="{{ doc.noImg }}">
            <span style="display: flex; flex-direction: column; justify-content: space-between; height: 100%; padding: 20px; box-sizing: border-box;">
              <span style="font-size: 14px; font-weight: 500; color: #0A602D;">{{ doc.org }}</span>
              <span style="font-size: 22px; font-weight: 700; line-height: 1.2; color: #0A602D;">{{ doc.coverTitle }}</span>
              <span style="font-size: 15px; color: #3D5246;">{{ doc.coverYear }}</span>
            </span>
          </template>
        </span>
        <div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 18px;">
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <template data-if="{{ doc.hasStatus }}"><span style="{{ doc.statusStyle }}">{{ doc.status }}</span></template>
            <h2 style="margin: 0; font-size: clamp(24px, 3.2vw, 34px); line-height: 1.2; font-weight: 700;">{{ doc.title }}</h2>
            <span style="color: #50656E;">{{ doc.meta }}</span>
            <template data-if="{{ doc.hasTemaer }}">
              <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-top: 4px;">
                <template data-for="{{ doc.temaLinks }}" data-as="tl">
                  <button type="button" onClick="{{ tl.go }}" style="{{ temaPillStyle }}">{{ tl.name }}</button>
                </template>
              </div>
            </template>
          </div>
          <section style="display: flex; flex-direction: column; gap: 6px; max-width: 680px; padding: 16px 18px; border-radius: 15px; background: #F4F6F2;">
            <h3 style="margin: 0; font-size: 16px;">Resumé</h3>
            <p style="margin: 0;">{{ doc.longRes }}</p>
            <span style="font-size: 13px; color: #50656E;">Lavet med AI ud fra dokumentet.</span>
          </section>
          <div style="display: flex; flex-wrap: wrap; gap: 10px;">
            <template data-if="{{ doc.hasUrl }}"><a href="{{ doc.url }}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; border-radius: 10px; background: #0A602D; color: #FFFFFF; text-decoration: none; font-weight: 500;">{{ doc.openLabel }}</a></template>
            <template data-if="{{ doc.noUrl }}"><span style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 10px; background: #F4F6F2; color: #50656E;">PDF'en er ikke lagt ind i prototypen</span></template>
            <button type="button" aria-expanded="{{ docAiStr }}" onClick="{{ askAboutDoc }}" style="min-height: 44px; padding: 0 18px; border: 1px solid #0A602D; border-radius: 10px; background: #FFFFFF; color: #0A602D; font: 500 15px 'Roboto', Arial, sans-serif; cursor: pointer;">Spørg om dokumentet</button>
          </div>
          <template data-if="{{ docAi }}">
            <section style="display: flex; flex-direction: column; gap: 10px; max-width: 680px; padding: 16px 18px; border: 1px solid #9CC9AA; border-radius: 15px; background: #FFFFFF;">
              <label for="docq" style="font-weight: 700;">Spørg om dokumentet</label>
              <textarea id="docq" rows="2" value="{{ docQ }}" onInput="{{ setDocQ }}" style="font: inherit; padding: 10px 12px; border: 1px solid #A9B5B0; border-radius: 10px; resize: vertical; color: #24312A;"></textarea>
              <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
                <button type="button" onClick="{{ askDocNow }}" style="min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #0A602D; color: #FFFFFF; font: 500 15px 'Roboto', Arial, sans-serif; cursor: pointer;">Spørg</button>
                <span style="font-size: 13px; color: #50656E;">Svarer ud fra dette dokument.</span>
              </div>
              <template data-if="{{ docAsked }}">
                <p style="margin: 0; padding-top: 12px; border-top: 1px solid #DAE0E0;">{{ docAnswer }}</p>
                <span style="font-size: 12px; color: #50656E;">Svaret er lavet med AI ud fra dokumentet. I prototypen er det et eksempel.</span>
              </template>
            </section>
          </template>
          <template data-if="{{ doc.hasVersions }}">
            <section style="display: flex; flex-direction: column; gap: 6px; max-width: 680px;">
              <h3 style="margin: 0 0 4px; font-size: 17px;">Alle udgaver</h3>
              <template data-for="{{ doc.versions }}" data-as="v">
                <button type="button" aria-current="{{ v.cur }}" onClick="{{ v.open }}" style="{{ v.style }}"><span>{{ v.label }}</span><span style="{{ v.statusStyle }}">{{ v.status }}</span></button>
              </template>
            </section>
          </template>
        </div>
      </article>
    </template>
  </main>

  <!-- Uden for hovedsiden: en lille tilbage-knap, der svæver i nederste højre hjørne og fører til det sted, man kom fra -->
  <template data-if="{{ hasCrumb }}">
    <button type="button" data-key="tilbage" onClick="{{ goBack }}" style="{{ backBtnStyle }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 18l-6-6 6-6"></path></svg><span>Tilbage</span></button>
  </template>

  <footer style="background: #0A602D; color: #E6F4EA;">
    <div style="max-width: 1320px; margin: 0 auto; padding: 24px max(16px, 3vw); font-size: 14px;">Affaldsviden.dk</div>
  </footer>
</div>
</template>
<script src="dc-lite.js?v=e530f879dd"></script>
<script src="app.js?v=85e7c5e8cd"></script>
<script>dcMount(document.getElementById('app'), document.getElementById('vb-skabelon').innerHTML, Component, {});</script>
</body>
</html>
